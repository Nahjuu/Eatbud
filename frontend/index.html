<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: necesario para que iOS informe de las áreas seguras
         (notch, barra inferior) cuando la app corre instalada. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Registro diario de comidas con análisis nutricional de Groq." />
    <title>Eatbud</title>

    <!-- PWA (Android / Chrome, Edge, Samsung Internet, escritorio) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#07110f" />
    <meta name="application-name" content="Eatbud" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <!-- PWA en iOS (Safari): icono, título corto y ventana sin controles. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Eatbud" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
